<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="45%" stop-color="#0d1b3f"/>
      <stop offset="100%" stop-color="#1a0a3a"/>
      <animate attributeName="x1" values="0;0.3;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2E86DE" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#26105a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fd3ff">
        <animate attributeName="stop-color" values="#8fd3ff;#26d0ce;#8fd3ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#a8c7ff;#ffffff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- simple clean sky (no stars) -->
  <rect width="1200" height="320" fill="url(#sky)"/>
  <rect width="1200" height="320" fill="url(#nebula)"/>

  <!-- title -->
  <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="155" font-size="56" font-weight="800" fill="url(#title)" filter="url(#softglow)"
          letter-spacing="1.5">Subrata Pramanik</text>
    <text x="600" y="200" font-size="20" font-weight="500" fill="#bcd4ff" letter-spacing="3">
      VISUAL DOCUMENT UNDERSTANDING &#183; COMPUTER VISION &#183; PATTERN RECOGNITION
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="240" font-size="15" font-weight="400" fill="#7fa8e0" letter-spacing="2">
      M.Tech&#8211;PhD Researcher @ IIIT Allahabad
    </text>
  </g>

  <!-- subtle bottom glow line -->
  <rect x="0" y="317" width="1200" height="3" fill="url(#title)" opacity="0.6"/>
</svg>
